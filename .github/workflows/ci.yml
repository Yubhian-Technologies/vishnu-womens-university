name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsc (typecheck) + vite build — the same command Vercel runs, so a
      # green check here means Vercel's build won't fail either.
      - run: npm run build

      # Informational only — dependency CVEs shouldn't block a merge on
      # their own, but should be visible in the run's output.
      - run: npm audit --audit-level=high
        continue-on-error: true
